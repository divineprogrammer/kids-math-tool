<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Practice App</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Setup Screen -->
    <div id="setupScreen" class="screen active">
        <div class="setup-container">
            <div class="setup-header">
                <h1 class="setup-title">✨ Math Quest ✨</h1>
                <p class="setup-subtitle">Get ready for an awesome math adventure!</p>
            </div>
            
            <div class="setup-card">
                <label class="section-label">📚 Pick Your Operations</label>
                <div class="operations-group">
                    <label class="operation-pill">
                        <input type="checkbox" id="additionCheck" checked>
                        <span class="pill-text">➕ Addition</span>
                    </label>
                    <label class="operation-pill">
                        <input type="checkbox" id="subtractionCheck" checked>
                        <span class="pill-text">➖ Subtraction</span>
                    </label>
                    <label class="operation-pill">
                        <input type="checkbox" id="multiplicationCheck" checked>
                        <span class="pill-text">✖️ Multiplication</span>
                    </label>
                </div>
            </div>

            <div class="setup-card">
                <label class="section-label">🔢 Number Difficulty</label>
                <div class="setup-row">
                    <div class="setup-field">
                        <label for="minDigits" class="field-label">Min Digits: <span id="minDigitsValue">1</span></label>
                        <input type="range" id="minDigits" class="field-slider" min="1" max="3" value="1">
                    </div>
                    <div class="setup-field">
                        <label for="maxDigits" class="field-label">Max Digits: <span id="maxDigitsValue">2</span></label>
                        <input type="range" id="maxDigits" class="field-slider" min="1" max="3" value="2">
                    </div>
                </div>
            </div>

            <div class="setup-card">
                <label class="section-label">📊 Problem Count</label>
                <div class="setup-row">
                    <div class="setup-field">
                        <label for="minTerms" class="field-label">Min Terms: <span id="minTermsValue">2</span></label>
                        <input type="range" id="minTerms" class="field-slider" min="2" max="5" value="2">
                    </div>
                    <div class="setup-field">
                        <label for="maxTerms" class="field-label">Max Terms: <span id="maxTermsValue">3</span></label>
                        <input type="range" id="maxTerms" class="field-slider" min="2" max="5" value="3">
                    </div>
                </div>
            </div>

            <div class="setup-card">
                <div class="setup-row compact-row">
                    <div class="setup-field">
                        <label for="questionCount" class="field-label">Total Questions</label>
                        <input type="number" id="questionCount" class="field-input" value="10" min="1" max="50">
                    </div>
                    <div class="setup-field">
                        <label for="timeLimit" class="field-label">Time (minutes)</label>
                        <input type="number" id="timeLimit" class="field-input" value="2" min="1" max="60">
                    </div>
                    <div class="setup-field checkbox-field">
                        <label class="operation-pill compact">
                            <input type="checkbox" id="disableTimerCheck" aria-label="Disable timer">
                            <span class="pill-text">Disable Timer</span>
                        </label>
                    </div>
                </div>
            </div>

            <div id="setupError" class="error-message"></div>

            <button id="startBtn" class="start-button">🚀 Start Practice 🚀</button>
        </div>
    </div>

    <!-- Practice Screen -->
    <div id="practiceScreen" class="screen">
        <div class="practice-header">
            <div class="question-counter">
                <span class="counter-label">Question</span>
                <span class="counter-num"><span id="questionNum">1</span> / <span id="totalQuestions">10</span></span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="timer-badge" id="timer">2:00</div>
        </div>

        <div class="practice-content">
            <div class="expression-card">
                <div class="expression" id="expression">12 + 8 = ?</div>
            </div>

            <div class="answer-bubble">
                <span class="answer-label">Your Answer:</span>
                <span class="answer-value" id="answerValue">_</span>
            </div>

            <div class="numberpad">
                <button class="pad-button num-button" data-num="1">1</button>
                <button class="pad-button num-button" data-num="2">2</button>
                <button class="pad-button num-button" data-num="3">3</button>
                <button class="pad-button num-button" data-num="4">4</button>
                <button class="pad-button num-button" data-num="5">5</button>
                <button class="pad-button num-button" data-num="6">6</button>
                <button class="pad-button num-button" data-num="7">7</button>
                <button class="pad-button num-button" data-num="8">8</button>
                <button class="pad-button num-button" data-num="9">9</button>
                <button class="pad-button clear-button" id="clearBtn">Clear</button>
                <button class="pad-button num-button" data-num="0">0</button>
                <button class="pad-button backspace-button" id="backspaceBtn">←</button>
                <button class="pad-button submit-button" id="submitBtn">✓ Submit</button>
            </div>
        </div>
    </div>

    <!-- Results Screen -->
    <div id="resultScreen" class="screen">
        <div class="result-container">
            <div class="result-header">
                <h1 class="result-title">Practice Complete!</h1>
            </div>

            <div class="victory-card">
                <div class="result-score-section">
                    <div class="score-label">Your Score</div>
                    <div class="score-display">
                        <span id="scoreNum">7</span> <span class="score-slash">/</span> <span id="scoreTotal">10</span>
                    </div>
                    <div class="percentage-display" id="percentageDisplay">70%</div>
                    <div class="encouragement" id="encouragement">Great job!</div>
                </div>

                <div class="result-summary">
                    <div class="result-stat">
                        <div class="stat-icon">✓</div>
                        <div class="stat-label">Correct</div>
                        <div class="stat-value correct-color" id="statCorrect">7</div>
                    </div>
                    <div class="result-stat">
                        <div class="stat-icon">✕</div>
                        <div class="stat-label">Wrong</div>
                        <div class="stat-value wrong-color" id="statWrong">2</div>
                    </div>
                    <div class="result-stat">
                        <div class="stat-icon">◯</div>
                        <div class="stat-label">Skipped</div>
                        <div class="stat-value unanswered-color" id="statUnanswered">1</div>
                    </div>
                </div>
            </div>

            <div class="confetti-container" id="confettiContainer"></div>

            <div class="result-review">
                <h2 class="review-title">Question Review</h2>
                <div class="review-list" id="reviewList">
                    <!-- Questions will be added here -->
                </div>
            </div>

            <div class="result-buttons">
                <button id="practiceAgainBtn" class="result-button again-button">Practice Again</button>
                <button id="backToSetupBtn" class="result-button setup-button">Back to Setup</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
